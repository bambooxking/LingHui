[project]
name = "inpainting-web"
version = "0.1.0"
description = "Local, extensible image inpainting and restoration web UI"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.12",
  # simple-lama-inpainting 0.1.2 requires Pillow < 10.
  "pillow>=9.5.0,<10.0.0",
  "numpy>=1.26.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "simple-lama-inpainting>=0.1.2",
  "diffusers>=0.31.0",
  "transformers>=4.45.0",
  "accelerate>=1.0.0",
  "safetensors>=0.4.5",
  "paddleocr>=2.8,<3.0",
  "paddlepaddle>=2.6,<3.0",
  "realesrgan>=0.3.0",
  "gfpgan>=1.3.8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


