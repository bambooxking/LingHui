</style></head><body><main class="app"><h1>本地图像工作台</h1><p>涂抹去水印 · AI 图像修复</p><div class="grid"><aside class="panel"><label>图片</label><input id="file" type="file" accept="image/*"><label>功能</label><select id="task"><option value="inpaint">水印消除</option><option value="restore">画质修复</option></select><section id="inpaintOptions"><label>消除模型</label><select id="inpaintModel"><option value="simple-lama">simple-lama-inpainting</option><option value="sdxl">SDXL Inpainting 0.1</option></select><label>涂抹工具</label><div class="tools"><button class="active" data-tool="brush">橡皮擦</button><button data-tool="circle">圆形</button><button data-tool="rect">长方形</button></div><label>橡皮擦大小 <span id="sizeValue">36</span> px</label><input id="size" type="range" min="4" max="160" value="36"><label>SDXL 提示词（可选）</label><input id="prompt" placeholder="如：clean wall texture"><label>SDXL 步数</label><input id="steps" type="number" min="1" max="50" value="25"><button id="clear" class="secondary">清除遮罩</button></section><section id="restoreOptions" hidden><label>修复模型</label><select id="restoreModel"><option value="realesrgan">Real-ESRGAN</option><option value="gfpgan">GFPGAN（人像）</option></select><label>放大倍率</label><select id="scale"><option value="4" selected>4×</option><option value="8">8×</option></select></section><button id="run">开始处理</button><a id="download" class="download" download="result.png">下载结果</a><div id="status"></div></aside><section class="stage"><div class="canvas-wrap" id="wrap"><span id="empty">请选择一张图片</span><canvas id="image"></canvas><canvas id="mask"></canvas></div></section></div></main><script>

<script>const guide=document.createElement('canvas'),gctx=guide.getContext('2d');guide.id='guide';mask.after(guide);function syncLayers(){if(!img.width)return;const left=img.offsetLeft,top=img.offsetTop,width=img.clientWidth,height=img.clientHeight;[mask,guide].forEach(c=>{c.style.left=left+'px';c.style.top=top+'px';c.style.width=width+'px';c.style.height=height+'px'});guide.width=mask.width;guide.height=mask.height}function clearGuide(){gctx.clearRect(0,0,guide.width,guide.height)}function drawGuide(point){clearGuide();gctx.save();gctx.setLineDash([7,5]);gctx.lineWidth=2;gctx.strokeStyle='rgba(44,94,146,.95)';if(tool==='circle'){gctx.beginPath();gctx.arc(start.x,start.y,Math.hypot(point.x-start.x,point.y-start.y),0,Math.PI*2);gctx.stroke()}else if(tool==='rect')gctx.strokeRect(Math.min(start.x,point.x),Math.min(start.y,point.y),Math.abs(point.x-start.x),Math.abs(point.y-start.y));gctx.restore()}function commitShape(point){mctx.fillStyle='white';if(tool==='circle'){mctx.beginPath();mctx.arc(start.x,start.y,Math.hypot(point.x-start.x,point.y-start.y),0,Math.PI*2);mctx.fill()}else if(tool==='rect')mctx.fillRect(Math.min(start.x,point.x),Math.min(start.y,point.y),Math.abs(point.x-start.x),Math.abs(point.y-start.y))}$('file').onchange=e=>{file=e.target.files[0];if(!file)return;const source=new Image;source.onload=()=>{ratio=Math.min(1,1200/source.width);[img,mask].forEach(c=>{c.width=source.width*ratio;c.height=source.height*ratio});ictx.drawImage(source,0,0,img.width,img.height);mctx.clearRect(0,0,mask.width,mask.height);$('empty').hidden=true;requestAnimationFrame(syncLayers)};source.src=URL.createObjectURL(file)};mask.onpointerdown=e=>{if(!file)return;syncLayers();drawing=true;start=last=pos(e);mask.setPointerCapture(e.pointerId)};mask.onpointermove=e=>{if(!drawing)return;const point=pos(e);if(tool==='brush'){paint(last,point);last=point}else drawGuide(point)};mask.onpointerup=e=>{if(!drawing)return;drawing=false;const point=pos(e);if(tool!=='brush')commitShape(point <script>const appShell=document.querySelector('.app'),stage=document.querySelector('.stage'),panel=document.querySelector('.panel'),fileInput=$('file'),batchView=document.createElement('section');batchView.className='batch-view';batchView.innerHTML='<h2 id="batchTitle">文字消除</h2><p id="batchCopy">PaddleOCR 会先识别文字区域，再由 SDXL 逐张重绘。结果将保存到所选目录的 text_removed 文件夹。</p><label for="textDirectory">图片目录</label><input id="textDirectory" placeholder="例如：D:\\images\\watermarked"><label for="textSteps">SDXL 推理步数</label><input id="textSteps" type="number" min="1" max="50" value="20"><button id="runTextRemove">开始批量文字消除</button><div id="batchStatus"></div></section>';stage.insertBefore(fileInput,wrap);stage.append(batchView);const nav=document.createElement('nav');nav.className='top-nav';nav.innerHTML='<button data-mode="home" class="active">首页</button><button data-mode="inpaint">涂抹消除</button><button data-mode="restore">画质修复</button><button data-mode="text">文字消除</button>';appShell.prepend(nav);function activate(mode){appShell.classList.toggle('text-mode',mode==='text');appShell.classList.toggle('home-mode',mode==='home');nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));if(mode==='inpaint'||mode==='restore'){$('task').value=mode==='inpaint'?'inpaint':'restore';$('task').dispatchEvent(new Event('change'));requestAnimationFrame(syncLayers)}if(mode==='home'){batchTitle.textContent='灵绘';batchCopy.textContent='本地图像工作台：面向去水印、画质增强与批量文字消除的一站式轻量工具。选择一个功能开始处理。'}else{batchTitle.textContent='文字消除';batchCopy.textContent='PaddleOCR 会先识别文字区域，再由 SDXL 逐张重绘。结果将保存到所选目录的 text_removed 文件夹。'}}nav.onclick=e=>{const mode=e.target.dataset.mode;if(mode)activate(mode)};$('runTextRemove').onclick=async()=>{const directory=$('textDirectory').value.trim(),status=$('batchStatus');if(!directory){status.textContent='请输入图片目录';return}const data=new FormData,jobId='text-'+Date.now()+'-'+Math.random().toString(16).slice(2);data.append('directory',directory);data.append('steps',$ .restore-compare__label--before{left:14px}.restore-compare__label--after{right:14px;background:rgba(36,127,192,.82)}

<script>
(() => {
  const compare = document.createElement('div');
  compare.className = 'restore-compare';
  compare.innerHTML = '<img class="restore-compare__before" alt="原图"><div class="restore-compare__after"><img alt="修复后"></div><span class="restore-compare__label restore-compare__label--before">原图</span><span class="restore-compare__label restore-compare__label--after">修复后</span><div class="restore-compare__handle"><span class="restore-compare__knob">↔</span></div><input class="restore-compare__range" type="range" min="0" max="100" value="50" aria-label="对比原图和修复后图片">';
  wrap.append(compare);

  const before = compare.querySelector('.restore-compare__before');
  const afterWrap = compare.querySelector('.restore-compare__after');
  const after = afterWrap.querySelector('img');
  const handle = compare.querySelector('.restore-compare__handle');
  const range = compare.querySelector('.restore-compare__range');
  let originalUrl = '';

  function setComparePosition(value) {
    const pos = Math.max(0, Math.min(100, Number(value)));
    afterWrap.style.width = pos + '%';
    handle.style.left = pos + '%';
    range.value = pos;
  }

  function hideCompare() {
    compare.classList.remove('is-visible');
    wrap.classList.remove('restore-compare-active', 'has-image');
  }

  function showCompare(beforeUrl, afterUrl) {
    before.src = beforeUrl;
    after.src = afterUrl;
    compare.classList.add('is-visible');
    wrap.classList.add('restore-compare-active');
    setComparePosition(50);
  }

  function rememberOriginalUrl(selected) {
    if (originalUrl) URL.revokeObjectURL(originalUrl);
    originalUrl = selected ? URL.createObjectURL(selected) : '';
  }

  const previousLoadOriginal = window.loadOriginal;
  if (typeof previousLoadOriginal === 'function') {
    window.loadOriginal = selected => {
      hideCompare();
      rememberOriginalUrl(selected);
      previousLoadOriginal(selected);
    };
    fileInput.onchange = e => window.loadOriginal(e.target.files[0]);
  }

  range.addEventListener('input', e => setComparePosition(e.target.value));
  compare.addEventListener('pointerdown', event => {
    const rect = compare.getBoundingClientRect();
    const move = pointer => setComparePosition(((pointer.clientX - rect.left) / rect.width) * 100);
    move(event);
    compare.setPointerCapture(event.pointerId);
  });
  compare.addEventListener('pointermove', event => {
    if (!compare.hasPointerCapture(event.pointerId)) return;
    const rect = compare.getBoundingClientRect();
    setComparePosition(((event.clientX - rect.left) / rect.width) * 100);
  });
  compare.addEventListener('pointerup', event => {
    if (compare.hasPointerCapture(event.pointerId)) compare.releasePointerCapture(event.pointerId);
  });

  const baseRun = $('run').onclick;
  $('run').onclick = async () => {
    if ($('task').value !== 'restore') {
      hideCompare();
      return baseRun();
    }
    if (!file) return $('status').textContent = '请先选择图片';
    const data = new FormData();
    data.append('image', file);
    data.append('model', $('restoreModel').value);
    data.append('scale', $('scale').value);
    $('status').textContent = '正在修复，请稍候…';
    $('download').style.display = 'none';
    try {
      const response = await fetch('/api/restore', {method: 'POST', body: data});
      if (!response.ok) throw Error(await readErrorMessage(response));
      const blob = await response.blob();
      const resultUrl = URL.createObjectURL(blob);
      const beforeUrl = originalUrl || URL.createObjectURL(file);
      showCompare(beforeUrl, resultUrl);
      $('download').href = resultUrl;
      $('download').style.display = 'block';
      $('status').textContent = '修复完成，可拖动滑杆对比原图。';
    } catch (error) {
      $('status').textContent = '失败：' + error.message;
    }
  };

  document.querySelector('.top-nav')?.addEventListener('click', event => {
    if (event.target.dataset.mode !== 'restore') hideCompare();
  });
  restoreOriginal?.addEventListener('click', hideCompare);
})();
</script>

<script id="lh-batch-quality-restore">

  if (!restoreButton || document.querySelector('.top-nav button[data-mode="restore-batch"]')) return;

  const navButton = document.createElement('button');

  const view = document.createElement('section');
  view.className = 'quality-batch-view';
  view.innerHTML = `

    <div class="quality-batch-progress"><span></span></div>
    <div id="qualityBatchStatus"></div>`;
  stage.append(view);

  const setMode = enabled => {
    appShell.classList.toggle('restore-batch-mode', enabled);
    if (enabled) {
      appShell.classList.remove('home-mode', 'text-mode');
      document.querySelectorAll('.top-nav button').forEach(button =>
        button.classList.toggle('active', button === navButton));
    }
  };
  navButton.addEventListener('click', () => requestAnimationFrame(() => setMode(true)));
  document.querySelector('.top-nav').addEventListener('click', event => {
    if (event.target !== navButton) setMode(false);
  });

  const progressBar = view.querySelector('.quality-batch-progress span');
  const status = view.querySelector('#qualityBatchStatus');
  const runButton = view.querySelector('#runQualityBatch');
  let selectedScale = 4;
  view.querySelector('.quality-batch-scales').addEventListener('click', event => {
    const button = event.target.closest('button[data-scale]');
    if (!button) return;
    selectedScale = Number(button.dataset.scale);
    view.querySelectorAll('.quality-batch-scales button').forEach(item =>
      item.classList.toggle('active', item === button));
    runButton.textContent = `开始批量 ×${selectedScale} 修复`;

    const directory = view.querySelector('#qualityBatchDirectory').value.trim();
    if (!directory) { status.textContent = '请输入图片目录'; return; }
    const data = new FormData();
    const jobId = 'restore-batch-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    data.append('directory', directory);
    data.append('scale', String(selectedScale));
    data.append('job_id', jobId);
    progressBar.style.width = '0%';
    status.textContent = `正在启动 Real-ESRGAN ×${selectedScale} 批量修复…`;
    let events;
    try {
      events = new EventSource('/api/progress/' + encodeURIComponent(jobId));
      events.onmessage = event => {
        const state = JSON.parse(event.data);
        status.textContent = state.message;
        progressBar.style.width = (state.percent || 0) + '%';
        if (state.done) events.close();
      };
      const response = await fetch('/api/restore-batch', {method:'POST', body:data});
      if (!response.ok) throw Error(await readErrorMessage(response));
      const body = await response.json();
      progressBar.style.width = '100%';
      status.textContent = `完成：成功 ${body.processed} 张，失败 ${body.failures.length} 张。\n输出：${body.output}`;
    } catch (error) {
      status.textContent = '处理失败：' + error.message;
    } finally {
      events?.close();
    }
  });
})();
</script>

<script id="lh-drop-upload">
(() => {
  const isImageFile = item => item && item.type && item.type.startsWith('image/');
  const uploadFromFile = selected => {
    if (!selected || !isImageFile(selected)) return;
    const transfer = new DataTransfer();
    transfer.items.add(selected);
    fileInput.files = transfer.files;
    fileInput.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const shouldOpenPicker = event => {
    if (appShell.classList.contains('text-mode') || appShell.classList.contains('home-mode')) return false;
    if (!file) return event.target === wrap || event.target === $('empty') || event.target === img;
    return false;
  };
  wrap.addEventListener('click', event => {
    if (!shouldOpenPicker(event)) return;
    event.preventDefault();
    fileInput.click();
  });
  ['dragenter','dragover'].forEach(type => wrap.addEventListener(type, event => {
    if (appShell.classList.contains('text-mode') || appShell.classList.contains('home-mode')) return;
    event.preventDefault();
    wrap.classList.add('is-dragging');
  }));
  ['dragleave','dragend'].forEach(type => wrap.addEventListener(type, event => {
    if (!wrap.contains(event.relatedTarget)) wrap.classList.remove('is-dragging');
  }));
  wrap.addEventListener('drop', event => {
    if (appShell.classList.contains('text-mode') || appShell.classList.contains('home-mode')) return;
    event.preventDefault();
    wrap.classList.remove('is-dragging');
    const selected = [...event.dataTransfer.files].find(isImageFile);
    uploadFromFile(selected);
  });
})();
</script>


<script id="lh-preview-state-guard">
(() => {
  const syncPreviewImageState = () => {
    const hasCanvasImage = !!file && !!img.width && !!img.height && document.getElementById('empty').hidden && !appShell.classList.contains('text-mode') && !appShell.classList.contains('home-mode');
    wrap.classList.toggle('has-image', hasCanvasImage);
  };
  const schedulePreviewSync = () => {
    requestAnimationFrame(() => {
      syncPreviewImageState();
      requestAnimationFrame(syncPreviewImageState);
    });
  };
  const imageWidth = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  const imageHeight = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  if (imageWidth?.set && imageHeight?.set && !img.__lhPreviewGuarded) {
    Object.defineProperty(img, 'width', {
      get(){ return imageWidth.get.call(this); },
      set(value){ imageWidth.set.call(this, value); schedulePreviewSync(); }
    });
    Object.defineProperty(img, 'height', {
      get(){ return imageHeight.get.call(this); },
      set(value){ imageHeight.set.call(this, value); schedulePreviewSync(); }
    });
    img.__lhPreviewGuarded = true;
  }
  fileInput.addEventListener('change', schedulePreviewSync);
  restoreOriginal?.addEventListener('click', schedulePreviewSync);
  $('run')?.addEventListener('click', () => setTimeout(schedulePreviewSync, 0));
  new MutationObserver(schedulePreviewSync).observe($('empty'), { attributes:true, attributeFilter:['hidden'] });
  schedulePreviewSync();
})();
</script>

<script id="lh-preview-controls">
(() => {

    zoomHint.textContent = `滚轮缩放 ${Math.round(previewZoom * 100)}%`;

    document.getElementById('empty').hidden = false;

<script id="lh-sdxl-progress">
(() => {
  const baseRun = $('run').onclick;
  const progress = document.createElement('div');
  progress.className = 'sdxl-progress';
  progress.innerHTML = '<div class="sdxl-progress__bar"></div>';
  $('status').insertAdjacentElement('afterend', progress);
  const setSdxlProgress = percent => {
    progress.classList.add('is-visible');
    progress.classList.remove('is-error');
    progress.querySelector('.sdxl-progress__bar').style.width = Math.max(0, Math.min(100, Number(percent) || 0)) + '%';
  };
  const failSdxlProgress = () => progress.classList.add('is-error');
  const hideSdxlProgress = () => {
    progress.classList.remove('is-visible','is-error');
    progress.querySelector('.sdxl-progress__bar').style.width = '0%';
  };

  $('run').onclick = async () => {
    const task = $('task').value;
    const isSdxlInpaint = task === 'inpaint' && $('inpaintModel').value === 'sdxl';
    if (!isSdxlInpaint) {
      hideSdxlProgress();
      return baseRun();
    }
    if (!file) return $('status').textContent = '请先上传图片';
    const jobId = 'inpaint-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    const data = new FormData();
    data.append('image', file);
    data.append('model', 'sdxl');
    data.append('mask', mask.toDataURL('image/png'));
    data.append('prompt', $('prompt').value);
    data.append('steps', $('steps').value);
    data.append('job_id', jobId);
    let source = null;
    $('download').style.display = 'none';
    $('status').textContent = '正在启动 SDXL 涂抹消除任务…';
    setSdxlProgress(0);
    try {
      source = new EventSource('/api/progress/' + encodeURIComponent(jobId));
      source.onmessage = event => {
        const state = JSON.parse(event.data);
        $('status').textContent = state.message;
        setSdxlProgress(state.percent || 0);
        if (state.done) source.close();
      };
      const response = await fetch('/api/inpaint', { method:'POST', body:data });
      if (!response.ok) throw Error(await readErrorMessage(response));
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const out = new Image();
      out.onload = () => {
        [img, mask].forEach(canvas => { canvas.width = out.width; canvas.height = out.height; });
        ictx.drawImage(out, 0, 0);
        mctx.clearRect(0, 0, mask.width, mask.height);
        wrap.classList.add('has-image');
        requestAnimationFrame(syncLayers);
      };
      out.src = url;
      $('download').href = url;
      $('download').style.display = 'block';
      $('status').textContent = 'SDXL 涂抹消除完成。';
      setSdxlProgress(100);
    } catch (error) {
      $('status').textContent = '失败：' + error.message;
      failSdxlProgress();
    } finally {
      if (source) source.close();
    }
  };
})();
</script>

<script id="lh-hold-original">
(() => {
  let processedImage = null;
  const drawToPreview = source => {
    if (!source) return;
    [img, mask].forEach(canvas => { canvas.width = source.width * ratio; canvas.height = source.height * ratio; });
    ictx.clearRect(0, 0, img.width, img.height);
    ictx.drawImage(source, 0, 0, img.width, img.height);
    mctx.clearRect(0, 0, mask.width, mask.height);
    wrap.classList.add('has-image');
    requestAnimationFrame(syncLayers);
  };
  const captureProcessedSoon = () => {
    let attempts = 0;
    const capture = () => {
      attempts += 1;
      if (!file || !img.width || !img.height) return;
      try {
        const snapshot = new Image();
        snapshot.onload = () => { processedImage = snapshot; };
        snapshot.src = img.toDataURL('image/png');
      } catch (_) {}
      if (!processedImage && attempts < 30) setTimeout(capture, 180);
    };
    setTimeout(capture, 120);
  };
  const originalBtn = document.createElement('button');
  originalBtn.type = 'button';
  originalBtn.className = 'preview-original';
  originalBtn.title = '长按查看原图';
  originalBtn.setAttribute('aria-label', '长按查看原图');
  const resetBtn = wrap.querySelector('.preview-reset');
  if (resetBtn) wrap.insertBefore(originalBtn, resetBtn); else wrap.append(originalBtn);

  const showOriginal = event => {
    if (!initialImage || !processedImage) return;
    event.preventDefault();
    event.stopPropagation();
    drawToPreview(initialImage);
  };
  const showProcessed = event => {
    if (!processedImage) return;
    event?.preventDefault?.();
    event?.stopPropagation?.();
    drawToPreview(processedImage);
  };
  ['pointerdown','mousedown','touchstart'].forEach(type => originalBtn.addEventListener(type, showOriginal, {passive:false}));
  ['pointerup','pointercancel','pointerleave','mouseup','mouseleave','touchend','touchcancel'].forEach(type => originalBtn.addEventListener(type, showProcessed, {passive:false}));

  const baseRun = $('run').onclick;
  $('run').onclick = async (...args) => {
    const result = await baseRun(...args);
    captureProcessedSoon();
    return result;
  };
  fileInput.addEventListener('change', () => { processedImage = null; });
  document.querySelector('.preview-reset')?.addEventListener('click', () => { processedImage = null; });
  restoreOriginal?.addEventListener('click', () => { processedImage = null; });
})();
</script>

  card.innerHTML = '<span class="home-card__icon">×2/4</span><h3>画质修复（批）</h3><p>指定图片目录，使用 Real-ESRGAN 将其中的图片批量放大两倍或四倍。</p><span class="home-card__go">→</span>';
  cards.append(card);
})();
</script>

<style id="lh-restore-pan-style">
.app:has(.top-nav button[data-mode=restore].active) .canvas-wrap.has-image{cursor:grab}
.app:has(.top-nav button[data-mode=restore].active) .canvas-wrap.has-image.is-panning{cursor:grabbing}
.canvas-wrap.has-image #image,
.canvas-wrap.has-image #mask,
.canvas-wrap.has-image #guide,
.canvas-wrap.has-image .restore-compare{
  transform:translate(var(--preview-pan-x,0px),var(--preview-pan-y,0px)) scale(var(--preview-zoom,1))!important;
}
</style>
<script id="lh-restore-scale-and-pan">
(() => {
  const scaleSelect = document.getElementById('scale');
  if (scaleSelect && !scaleSelect.querySelector('option[value="2"]')) {
    const option = document.createElement('option');
    option.value = '2';
    option.textContent = '2×';
    scaleSelect.prepend(option);
  }

  let panX = 0;
  let panY = 0;
  let pointerId = null;
  let lastX = 0;
  let lastY = 0;
  const applyPan = () => {
    wrap.style.setProperty('--preview-pan-x', panX + 'px');
    wrap.style.setProperty('--preview-pan-y', panY + 'px');
  };
  const resetPan = () => { panX = 0; panY = 0; applyPan(); };
  const isRestorePreview = () =>
    document.getElementById('task').value === 'restore' &&
    wrap.classList.contains('has-image') &&
    !wrap.classList.contains('restore-compare-active');

  wrap.addEventListener('pointerdown', event => {
    if (!isRestorePreview() || event.button !== 0 || event.target.closest('button,a,input')) return;
    event.preventDefault();
    event.stopPropagation();
    pointerId = event.pointerId;
    lastX = event.clientX;
    lastY = event.clientY;
    wrap.classList.add('is-panning');
    wrap.setPointerCapture(pointerId);
  }, true);
  wrap.addEventListener('pointermove', event => {
    if (pointerId !== event.pointerId) return;
    event.preventDefault();
    panX += event.clientX - lastX;
    panY += event.clientY - lastY;
    lastX = event.clientX;
    lastY = event.clientY;
    applyPan();
  }, true);
  const finishPan = event => {
    if (pointerId !== event.pointerId) return;
    if (wrap.hasPointerCapture(pointerId)) wrap.releasePointerCapture(pointerId);
    pointerId = null;
    wrap.classList.remove('is-panning');
  };
  wrap.addEventListener('pointerup', finishPan, true);
  wrap.addEventListener('pointercancel', finishPan, true);
  fileInput.addEventListener('change', resetPan);
  document.querySelector('.preview-reset')?.addEventListener('click', resetPan);
  restoreOriginal?.addEventListener('click', resetPan);
  document.querySelector('.top-nav')?.addEventListener('click', resetPan);
})();
</script>
