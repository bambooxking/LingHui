name: LingHui
options:
  bundleIdPrefix: com.linghui
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
targets:
  LingHui:
    type: application
    platform: iOS
    sources:
      - path: LingHui
      - path: ../../models/lama_dilated.mlmodelc
        type: folder
        buildPhase: resources
      - path: ../../models/Real-ESRGAN-x4plus.mlmodelc
        type: folder
        buildPhase: resources
      - path: ../../models/PP-OCRv5_mobile_det.mlmodelc
        type: folder
        buildPhase: resources
      - path: ../../models/mobile_sam_encoder.mlmodelc
        type: folder
        buildPhase: resources
      - path: ../../models/mobile_sam_decoder.mlmodelc
        type: folder
        buildPhase: resources
      - path: ../../models/mobile_sam_prompt_encoder_weights.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanzx.linghui
        PRODUCT_NAME: LingHui
        INFOPLIST_KEY_CFBundleDisplayName: 灵绘
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LingHui/Info.plist
      properties:
        CFBundleDisplayName: 灵绘
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: 灵绘需要读取照片，以便在本地进行图片处理。
        NSPhotoLibraryAddUsageDescription: 灵绘需要保存处理后的图片到您的相册。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
